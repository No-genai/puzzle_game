<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffd54a">
<title>しゃしんパズル</title>
<style>
  :root {
    --bg: #fff8e6;
    --card: #ffffff;
    --accent: #ff7a59;
    --accent2: #4ac0ff;
    --yellow: #ffd54a;
    --green: #57cc66;
    --ink: #4a3f35;
    --shadow: 0 6px 0 rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 14px 14px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  h1 {
    text-align: center;
    font-size: 28px;
    margin: 6px 0 12px;
    letter-spacing: 1px;
  }
  h1 .emoji { font-size: 30px; }

  /* buttons */
  .btn {
    border: none;
    border-radius: 18px;
    padding: 14px 18px;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: var(--accent);
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .05s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .btn.blue { background: var(--accent2); }
  .btn.green { background: var(--green); }
  .btn.yellow { background: var(--yellow); color: var(--ink); }
  .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.08); border: 2px solid #eee; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.big { width: 100%; padding: 18px; font-size: 20px; }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,.06);
    margin-bottom: 14px;
  }

  .hidden { display: none !important; }

  /* start screen */
  .start-actions { display: flex; flex-direction: column; gap: 12px; }
  .hint { text-align: center; font-size: 14px; color: #9b8e80; margin-top: 6px; }

  /* difficulty picker */
  .section-title { font-size: 16px; font-weight: 700; margin: 4px 2px 10px; }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .level {
    border: 3px solid #eee;
    background: #fff;
    border-radius: 18px;
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    transition: all .1s ease;
  }
  .level .face { font-size: 26px; }
  .level .name { font-size: 13px; font-weight: 700; margin-top: 2px; }
  .level .grid { font-size: 11px; color: #b3a89b; }
  .level.active { border-color: var(--accent); background: #fff2ee; transform: translateY(-2px); }

  /* preview */
  .preview-wrap { text-align: center; }
  .preview-wrap img {
    max-width: 100%;
    max-height: 240px;
    border-radius: 16px;
    box-shadow: var(--shadow);
  }

  /* game */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .stats { display: flex; gap: 8px; }
  .stat {
    background: #fff;
    border-radius: 14px;
    padding: 8px 12px;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 3px 0 rgba(0,0,0,.06);
    display: flex; align-items: center; gap: 5px;
  }
  .board-wrap { position: relative; }
  .board {
    display: grid;
    gap: 3px;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #e9dfce;
    border-radius: 16px;
    padding: 3px;
    box-shadow: var(--shadow);
  }
  .tile {
    background-size: cover;
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    transition: transform .08s ease, outline-color .1s ease;
    outline: 0px solid transparent;
    background-color: #d9cdb8;
  }
  .tile.selected {
    outline: 4px solid var(--accent);
    outline-offset: -4px;
    transform: scale(.94);
    z-index: 2;
  }
  .tile .num {
    position: absolute;
    top: 3px; left: 3px;
    background: rgba(0,0,0,.45);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
  }
  .board.hide-num .num { display: none; }

  .controls { display: flex; gap: 10px; margin-top: 14px; }
  .controls .btn { flex: 1; font-size: 16px; padding: 14px 8px; }

  /* reference overlay */
  .ref-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  .ref-overlay img { max-width: 100%; max-height: 80vh; border-radius: 16px; }

  /* win overlay */
  .win {
    position: fixed; inset: 0;
    background: rgba(255,248,230,.94);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; z-index: 60; padding: 24px; text-align: center;
  }
  .win h2 { font-size: 40px; margin: 0; }
  .win .big-emoji { font-size: 72px; animation: pop .5s ease; }
  .win img { max-width: 80%; max-height: 46vh; border-radius: 16px; box-shadow: var(--shadow); }
  .win .stats-line { font-size: 18px; font-weight: 700; }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.25)} 100%{transform:scale(1)} }

  /* confetti */
  .confetti { position: fixed; top: -10px; width: 10px; height: 14px; z-index: 61; border-radius: 2px; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: 1; } }

  .footer-note { text-align: center; font-size: 12px; color: #b3a89b; margin-top: auto; padding-top: 16px; }
</style>
</head>
<body>
<div class="app">
  <h1><span class="emoji">🧩</span> しゃしんパズル</h1>

  <!-- ========== START SCREEN ========== -->
  <div id="startScreen">
    <div class="card">
      <div class="section-title">1. しゃしんを えらぶ</div>
      <div class="start-actions">
        <button class="btn big" id="cameraBtn">📷 カメラで とる</button>
        <button class="btn big blue" id="galleryBtn">🖼️ しゃしんを えらぶ</button>
      </div>
      <div class="preview-wrap hidden" id="previewWrap" style="margin-top:14px;">
        <img id="previewImg" alt="えらんだ しゃしん">
      </div>
      <div class="hint">しゃしんは このタブレット／スマホの なかだけで つかいます</div>
    </div>

    <div class="card">
      <div class="section-title">2. むずかしさ を えらぶ</div>
      <div class="levels" id="levels">
        <div class="level" data-n="2"><div class="face">😊</div><div class="name">とても<br>かんたん</div><div class="grid">2×2</div></div>
        <div class="level active" data-n="3"><div class="face">🙂</div><div class="name">かんたん</div><div class="grid">3×3</div></div>
        <div class="level" data-n="4"><div class="face">😃</div><div class="name">ふつう</div><div class="grid">4×4</div></div>
        <div class="level" data-n="5"><div class="face">😎</div><div class="name">むずかしい</div><div class="grid">5×5</div></div>
      </div>
    </div>

    <button class="btn big green" id="startBtn" disabled>▶️ スタート！</button>
    <div class="hint" id="startHint">さきに しゃしんを えらんでね</div>
  </div>

  <!-- ========== GAME SCREEN ========== -->
  <div id="gameScreen" class="hidden">
    <div class="topbar">
      <button class="btn ghost" id="backBtn" style="padding:10px 14px;font-size:15px;">← もどる</button>
      <div class="stats">
        <div class="stat">👆 <span id="moves">0</span></div>
        <div class="stat">⏱️ <span id="timer">0:00</span></div>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="controls">
      <button class="btn yellow" id="hintBtn">👀 おてほん</button>
      <button class="btn blue" id="numBtn">🔢 ばんごう</button>
      <button class="btn" id="shuffleBtn">🔀 まぜる</button>
    </div>
  </div>

  <div class="footer-note">がぞうは たんまつの そとに おくられません 🔒</div>
</div>

<!-- reference overlay -->
<div class="ref-overlay hidden" id="refOverlay">
  <img id="refImg" alt="おてほん">
</div>

<!-- win overlay -->
<div class="win hidden" id="winOverlay">
  <div class="big-emoji">🎉</div>
  <h2>できた！</h2>
  <img id="winImg" alt="かんせい">
  <div class="stats-line" id="winStats"></div>
  <button class="btn big green" id="playAgainBtn" style="max-width:280px;">🔁 もういちど</button>
  <button class="btn ghost" id="newPhotoBtn" style="max-width:280px;">🖼️ べつの しゃしんで</button>
</div>

<!-- hidden file inputs -->
<input type="file" accept="image/*" capture="environment" id="cameraInput" class="hidden">
<input type="file" accept="image/*" id="galleryInput" class="hidden">

<script>
(function () {
  "use strict";

  // ---- state ----
  var state = {
    imgDataUrl: null,   // cropped square image (data URL)
    n: 3,               // grid size (n x n)
    order: [],          // order[position] = original tile index
    selected: null,     // selected position index, or null
    moves: 0,
    startTime: 0,
    timerId: null,
    showNum: false,
    finished: false
  };

  // ---- element refs ----
  var $ = function (id) { return document.getElementById(id); };
  var startScreen = $("startScreen");
  var gameScreen  = $("gameScreen");
  var board       = $("board");

  // ---- image loading & square cropping ----
  function loadFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      cropToSquare(e.target.result, function (squareUrl) {
        state.imgDataUrl = squareUrl;
        $("previewImg").src = squareUrl;
        $("previewWrap").classList.remove("hidden");
        updateStartButton();
      });
    };
    reader.readAsDataURL(file);
  }

  function cropToSquare(dataUrl, cb) {
    var img = new Image();
    img.onload = function () {
      var side = Math.min(img.width, img.height);
      var size = Math.min(side, 900); // cap resolution for performance
      var canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext("2d");
      var sx = (img.width - side) / 2;
      var sy = (img.height - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      cb(canvas.toDataURL("image/jpeg", 0.9));
    };
    img.src = dataUrl;
  }

  function updateStartButton() {
    var ready = !!state.imgDataUrl;
    $("startBtn").disabled = !ready;
    $("startHint").style.display = ready ? "none" : "block";
  }

  // ---- difficulty ----
  var levels = $("levels");
  Array.prototype.forEach.call(levels.querySelectorAll(".level"), function (el) {
    el.addEventListener("click", function () {
      levels.querySelectorAll(".level").forEach(function (x) { x.classList.remove("active"); });
      el.classList.add("active");
      state.n = parseInt(el.getAttribute("data-n"), 10);
    });
  });

  // ---- file input wiring ----
  $("cameraBtn").addEventListener("click", function () { $("cameraInput").click(); });
  $("galleryBtn").addEventListener("click", function () { $("galleryInput").click(); });
  $("cameraInput").addEventListener("change", function (e) { loadFile(e.target.files[0]); this.value = ""; });
  $("galleryInput").addEventListener("change", function (e) { loadFile(e.target.files[0]); this.value = ""; });

  // ---- start / back ----
  $("startBtn").addEventListener("click", startGame);
  $("backBtn").addEventListener("click", goToStart);
  $("playAgainBtn").addEventListener("click", function () { hideWin(); startGame(); });
  $("newPhotoBtn").addEventListener("click", function () { hideWin(); goToStart(); });

  function goToStart() {
    stopTimer();
    gameScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
  }

  function startGame() {
    var n = state.n;
    state.showNum = false;
    board.classList.add("hide-num");
    state.finished = false;
    state.selected = null;

    // build a solved order then shuffle into a solvable, non-solved arrangement
    state.order = [];
    for (var i = 0; i < n * n; i++) state.order.push(i);
    shuffleOrder();

    buildBoard();
    state.moves = 0;
    $("moves").textContent = "0";
    startTimer();

    startScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
  }

  function shuffleOrder() {
    // Fisher-Yates; reshuffle if it lands solved (any n>=2 has other perms)
    do {
      for (var i = state.order.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = state.order[i]; state.order[i] = state.order[j]; state.order[j] = t;
      }
    } while (isSolved());
  }

  // ---- board rendering ----
  function buildBoard() {
    var n = state.n;
    board.style.gridTemplateColumns = "repeat(" + n + ", 1fr)";
    board.innerHTML = "";
    for (var pos = 0; pos < n * n; pos++) {
      var tile = document.createElement("div");
      tile.className = "tile";
      tile.setAttribute("data-pos", pos);
      var num = document.createElement("span");
      num.className = "num";
      tile.appendChild(num);
      board.appendChild(tile);
    }
    renderTiles();
  }

  function renderTiles() {
    var n = state.n;
    var tiles = board.children;
    for (var pos = 0; pos < tiles.length; pos++) {
      var orig = state.order[pos];
      var row = Math.floor(orig / n);
      var col = orig % n;
      var el = tiles[pos];
      el.style.backgroundImage = "url(" + state.imgDataUrl + ")";
      el.style.backgroundSize = (n * 100) + "% " + (n * 100) + "%";
      // background-position as percentage: col/(n-1)*100
      var px = n === 1 ? 0 : (col / (n - 1)) * 100;
      var py = n === 1 ? 0 : (row / (n - 1)) * 100;
      el.style.backgroundPosition = px + "% " + py + "%";
      el.querySelector(".num").textContent = (orig + 1);
      el.classList.toggle("selected", state.selected === pos);
    }
  }

  // ---- tap-to-swap interaction ----
  board.addEventListener("click", function (e) {
    if (state.finished) return;
    var tile = e.target.closest(".tile");
    if (!tile) return;
    var pos = parseInt(tile.getAttribute("data-pos"), 10);

    if (state.selected === null) {
      state.selected = pos;
      renderTiles();
    } else if (state.selected === pos) {
      state.selected = null; // deselect
      renderTiles();
    } else {
      // swap
      var a = state.selected, b = pos;
      var t = state.order[a]; state.order[a] = state.order[b]; state.order[b] = t;
      state.selected = null;
      state.moves++;
      $("moves").textContent = state.moves;
      renderTiles();
      if (isSolved()) win();
    }
  });

  function isSolved() {
    for (var i = 0; i < state.order.length; i++) {
      if (state.order[i] !== i) return false;
    }
    return true;
  }

  // ---- timer ----
  function startTimer() {
    stopTimer();
    state.startTime = Date.now();
    $("timer").textContent = "0:00";
    state.timerId = setInterval(function () {
      var s = Math.floor((Date.now() - state.startTime) / 1000);
      var m = Math.floor(s / 60);
      var ss = s % 60;
      $("timer").textContent = m + ":" + (ss < 10 ? "0" : "") + ss;
    }, 500);
  }
  function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }

  // ---- controls ----
  var refOverlay = $("refOverlay");
  $("hintBtn").addEventListener("click", function () {
    $("refImg").src = state.imgDataUrl;
    refOverlay.classList.remove("hidden");
  });
  refOverlay.addEventListener("click", function () { refOverlay.classList.add("hidden"); });

  $("numBtn").addEventListener("click", function () {
    state.showNum = !state.showNum;
    board.classList.toggle("hide-num", !state.showNum);
  });

  $("shuffleBtn").addEventListener("click", function () {
    if (state.finished) return;
    shuffleOrder();
    state.selected = null;
    state.moves = 0;
    $("moves").textContent = "0";
    startTimer();
    renderTiles();
  });

  // ---- win ----
  function win() {
    state.finished = true;
    stopTimer();
    var el = $("timer").textContent;
    $("winImg").src = state.imgDataUrl;
    $("winStats").textContent = "👆 " + state.moves + "かい ・ ⏱️ " + el;
    $("winOverlay").classList.remove("hidden");
    launchConfetti();
  }
  function hideWin() { $("winOverlay").classList.add("hidden"); }

  function launchConfetti() {
    var colors = ["#ff7a59", "#4ac0ff", "#ffd54a", "#57cc66", "#c77dff"];
    for (var i = 0; i < 40; i++) {
      (function () {
        var c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        var dur = 1.5 + Math.random() * 1.5;
        c.style.animation = "fall " + dur + "s linear forwards";
        c.style.animationDelay = (Math.random() * 0.6) + "s";
        c.style.opacity = "0";
        document.body.appendChild(c);
        setTimeout(function () { c.remove(); }, (dur + 1) * 1000);
      })();
    }
  }

  // ---- init ----
  updateStartButton();
})();
</script>
</body>
</html>
